[project]
name = "agent-runtime"
version = "0.1.0"
description = "Shared HTTP runtime for Claude Agent SDK agents built on skill plugins"
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.55",
    "fastapi>=0.115",
    "pydantic>=2.7",
    "sse-starlette>=2.1",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
test = ["httpx>=0.27", "pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_runtime"]
